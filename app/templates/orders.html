{% extends 'base.html' %}{% block content %}<div class="row-between"><h1>Mes commandes</h1><form method="get"><select name="status" onchange="this.form.submit()"><option value="">Tous les statuts</option>{% for s in ['confirmed','preparing','out_for_delivery','delivered','cancelled','payment_failed'] %}<option value="{{ s }}" {% if status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></form></div><div class="list">{% for o in orders %}<a class="card order" href="{{ url_for('orders.order_detail', order_id=o.id) }}"><div><strong>#{{ o.id }} · {{ o.restaurant.name }}</strong><p>{{ o.created_at.strftime('%d/%m/%Y %H:%M') }}</p></div><div><span class="status {{ o.status }}">{{ o.status }}</span><strong>{{ '%.2f'|format(o.total) }} €</strong></div></a>{% else %}<p>Aucune commande.</p>{% endfor %}</div>{% endblock %}
